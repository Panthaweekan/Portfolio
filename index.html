<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/Portfolio/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme (or the OS preference) before first paint.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <meta name="author" content="Panthaweekan Somngam" />
    <meta
      name="description"
      content="Panthaweekan Somngam, software engineer in Bangkok. I take systems from a written spec to running code: Go services, data pipelines and the dashboards on top."
    />
    <meta
      name="keywords"
      content="Software Engineer, Go Developer, TypeScript, React, Web Development, Portfolio, API Gateway, Hexagonal Architecture, Cloud-Native, Microservices"
    />
    <meta name="theme-color" content="#1F3BD6" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta

      content="https://panthaweekan.github.io/Portfolio/"
    />

      content="Panthaweekan Somngam, software engineer in Bangkok. I take systems from a written spec to running code: Go services, data pipelines and the dashboards on top."
    />
    <meta

    />
    <meta property="og:image:width" content="1200" />

  </head>
  <body>
    <!-- GitHub Pages SPA redirect restoration -->
    <script>
      (function() {
        var redirectPath = sessionStorage.getItem('spa-redirect-path');
        if (redirectPath) {
          sessionStorage.removeItem('spa-redirect-path');
          history.replaceState(null, '', redirectPath);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
